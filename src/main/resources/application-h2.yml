# ---------------------------------------------------------------
# FALLBACK database = H2 (in-memory, nothing to install)
# Loaded automatically ONLY when the "h2" environment is active.
# Every value below replaces the PostgreSQL value in application.yml.
# NOTE: data is lost when the app stops.
# ---------------------------------------------------------------
datasources:
  default:
    url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    dialect: H2
